name: CI Windows (Self hosted runner)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-deps:
    name: Dependencies
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conan 2
        run: pip install "conan>=2.0,<3.0"

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan/profiles/windows') }}

      - name: Install dependencies (cache hit)
        if: steps.conan-cache.outputs.cache-hit == 'true'
        run: |
          conan install . `
            -pr:h conan/profiles/windows `
            -pr:b default `
            -s build_type=Release `
            --output-folder=build

      - name: Install dependencies (cache miss)
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: |
          conan profile detect --force
          
          conan export conan/recipes/scintilla3
          conan export conan/recipes/winlamb

          conan install . `
            -pr:h conan/profiles/windows `
            -pr:b default `
            -s build_type=Release `
            --output-folder=build `
            --build=missing

      - name: Save Conan cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan/profiles/windows') }}
