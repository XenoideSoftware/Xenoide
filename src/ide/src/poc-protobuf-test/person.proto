
syntax = "proto2";

message Person {
    required string name = 1;
    required int32 id = 2;
    required string email = 3;
    required string phone = 4;
}

message Person2 {
    required string name = 1;
    required int32 id = 2;
}

service FooService {
  rpc GetSomething(Person) returns (Person);
  rpc ListSomething(Person) returns (Person);
}
