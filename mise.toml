[tasks."coverage:gcov:debug"]
description = "Generate code coverage using GCC and gcov (Debug configuration)"
usage = '''
flag "--project <project>" help="Subproject to operate on: engine, ide, pocs or all" default="all" {
  choices "engine" "ide" "pocs" "all"
}
flag "--config <config>" help="Build configuration to run coverage for: Debug, Release or all"
flag "--export <format>" help="Report export format: text, html or csv"
flag "--check <threshold>" help="Enforce a minimum line coverage percentage (default 90); exits 1 if below"
flag "--output-dir <dir>" help="Output directory for report files (default <subproject>/coverage/<tool>)"
flag "--clean" help="Clean existing profile counters before running tests"
'''
run = './mise/coverage.sh gcov --config Debug --project "{{ usage.project }}"'
run_windows = 'powershell -ExecutionPolicy Bypass -File mise/coverage.ps1 -Tool gcov -Configuration Debug -Project {{ usage.project }}'

