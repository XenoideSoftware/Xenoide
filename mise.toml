[tasks."setup:export-recipes"]
description = "Export all local custom Conan recipes to cache"
run = "./mise/setup-export-recipes.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/setup-export-recipes.ps1"

[tasks."setup:release"]
description = "Install Conan dependencies for Release configuration"
run = "./mise/setup.sh Release"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/setup.ps1 -Configuration Release"

[tasks."setup:debug"]
description = "Install Conan dependencies for Debug configuration"
run = "./mise/setup.sh Debug"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/setup.ps1 -Configuration Debug"

[tasks.setup]
description = "Default dependency setup (Release)"
depends = ["setup:release", "setup:debug"]

[tasks."configure:release"]
description = "Configure CMake for Release build"
depends = ["setup:release"]
run = "./mise/configure.sh Release"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/configure.ps1 -Configuration Release"

[tasks."configure:debug"]
description = "Configure CMake for Debug build"
depends = ["setup:debug"]
run = "./mise/configure.sh Debug"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/configure.ps1 -Configuration Debug"

[tasks.configure]
description = "Default CMake configuration (Release)"
depends = ["configure:release"]

[tasks."build:release"]
description = "Build Release binaries"
depends = ["configure:release"]
run = "./mise/build.sh Release"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/build.ps1 -Configuration Release"

[tasks."build:debug"]
description = "Build Debug binaries"
depends = ["configure:debug"]
run = "./mise/build.sh Debug"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/build.ps1 -Configuration Debug"

[tasks.build]
description = "Default build (Release)"
depends = ["build:release"]

[tasks."test:release"]
description = "Run tests for Release build"
depends = ["build:release"]
run = "./mise/test.sh Release"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/test.ps1 -Configuration Release"

[tasks."test:debug"]
description = "Run tests for Debug build"
depends = ["build:debug"]
run = "./mise/test.sh Debug"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/test.ps1 -Configuration Debug"

[tasks.test]
description = "Default test (Release)"
depends = ["test:release"]

[tasks.format]
description = "Format C/C++ source files in src/ using clang-format"
run = "./mise/format.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/format.ps1"

[tasks."setup:tidy:debug"]
description = "Install Conan dependencies for tidy (Debug)"
run = "./mise/setup-tidy.sh Debug"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/setup-tidy.ps1 -Configuration Debug"

[tasks."setup:tidy:release"]
description = "Install Conan dependencies for tidy (Release)"
run = "./mise/setup-tidy.sh Release"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/setup-tidy.ps1 -Configuration Release"

[tasks."configure:tidy:debug"]
description = "Configure CMake for tidy analysis (Debug)"
depends = ["setup:tidy:debug"]
run = "./mise/configure-tidy.sh Debug"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/configure-tidy.ps1 -Configuration Debug"

[tasks."configure:tidy:release"]
description = "Configure CMake for tidy analysis (Release)"
depends = ["setup:tidy:release"]
run = "./mise/configure-tidy.sh Release"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/configure-tidy.ps1 -Configuration Release"

[tasks."tidy:debug"]
description = "Run clang-tidy against the Debug build"
depends = ["configure:tidy:debug"]
usage = '''
flag "--fix" help="Apply clang-tidy fix-its to source files"
flag "--full" help="Check all files in compile_commands.json instead of only git-modified files"
flag "--format" help="Reformat fixed files with clang-format (requires --fix)"
flag "--file <file>" help="Run clang-tidy on a single file, regardless of git status"
'''
run = "./mise/tidy.sh Debug"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/tidy.ps1 -Configuration Debug"

[tasks."tidy:release"]
description = "Run clang-tidy against the Release build"
depends = ["configure:tidy:release"]
usage = '''
flag "--fix" help="Apply clang-tidy fix-its to source files"
flag "--full" help="Check all files in compile_commands.json instead of only git-modified files"
flag "--format" help="Reformat fixed files with clang-format (requires --fix)"
flag "--file <file>" help="Run clang-tidy on a single file, regardless of git status"
'''
run = "./mise/tidy.sh Release"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/tidy.ps1 -Configuration Release"

[tasks.tidy]
description = "Run clang-tidy against both Debug and Release builds for full coverage"
depends = ["configure:tidy:debug", "configure:tidy:release"]
usage = '''
flag "--fix" help="Apply clang-tidy fix-its to source files"
flag "--full" help="Check all files in compile_commands.json instead of only git-modified files"
flag "--format" help="Reformat fixed files with clang-format (requires --fix)"
flag "--file <file>" help="Run clang-tidy on a single file, regardless of git status"
'''
run = """
./mise/tidy.sh Debug
./mise/tidy.sh Release
"""
run_windows = """
powershell -ExecutionPolicy Bypass -File mise/tidy.ps1 -Configuration Debug
powershell -ExecutionPolicy Bypass -File mise/tidy.ps1 -Configuration Release
"""

[tasks.clean]
description = "Clean build directories"
run = "./mise/clean.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/clean.ps1"
