name: CI Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-deps:
    name: Dependencies
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conan 2
        run: pip install "conan>=2.0,<3.0"

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan/profiles/windows') }}

      - name: Install dependencies (cache hit)
        if: steps.conan-cache.outputs.cache-hit == 'true'
        run: |
          conan install . `
            -pr:h conan/profiles/windows `
            -pr:b default `
            -s build_type=Release `
            --output-folder=build

      - name: Install dependencies (cache miss)
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: |
          conan profile detect --force
          
          conan export conan/recipes/scintilla3
          conan export conan/recipes/winlamb

          conan install . `
            -pr:h conan/profiles/windows `
            -pr:b default `
            -s build_type=Release `
            --output-folder=build `
            --build=missing

      - name: Save Conan cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan/profiles/windows') }}

      - name: Stage artifacts for upload
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\conan-cache
          Copy-Item -Recurse -Path "$env:USERPROFILE\.conan2\*" -Destination artifacts\conan-cache\

      - name: Upload dependencies artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-deps
          path: |
            build/
            artifacts/conan-cache/

  build:
    name: Build (UNICODE=${{ matrix.unicode }})
    needs: build-deps
    runs-on: windows-latest
    strategy:
      matrix:
        unicode: [ON, OFF]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conan 2
        run: pip install "conan>=2.0,<3.0"

      - name: Download dependencies artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-deps

      - name: Restore Conan cache from artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.conan2\"
          Copy-Item -Recurse -Path artifacts\conan-cache\* -Destination "$env:USERPROFILE\.conan2\"

      - name: Install dependencies
        run: |
          conan install . `
            -pr:h conan/profiles/windows `
            -pr:b default `
            -s build_type=Release `
            --output-folder=build

      - name: Configure CMake
        run: cmake --preset conan-default -DXENOIDE_WIN32_UNICODE=${{ matrix.unicode }} -DXENOIDE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset conan-release
