[tasks."setup:export-recipes"]
description = "Export all local custom Conan recipes to cache"
run = '''
python3 -c '
import os, re, subprocess, sys

packages_dir = "conan/packages"
for pkg in sorted(os.listdir(packages_dir)):
    pkg_dir = os.path.join(packages_dir, pkg)
    conanfile = os.path.join(pkg_dir, "conanfile.py")
    conandata = os.path.join(pkg_dir, "conandata.yml")
    if not os.path.isfile(conanfile):
        continue
    
    with open(conanfile, "r") as f:
        conanfile_content = f.read()
    
    has_version = bool(re.search(r"^\s*version\s*=", conanfile_content, re.MULTILINE))
    
    if has_version:
        print(f"==> Exporting {pkg} ({pkg_dir})")
        subprocess.run(["conan", "export", pkg_dir], check=True)
    else:
        versions = []
        if os.path.isfile(conandata):
            with open(conandata, "r") as f:
                in_sources = False
                for line in f:
                    stripped = line.strip()
                    if stripped.startswith("sources:"):
                        in_sources = True
                        continue
                    if in_sources:
                        if line.startswith("  ") and not line.startswith("    "):
                            m = re.match(r"^\s*[\"\x27]?([^\"\x27:]+)[\"\x27]?\s*:", line)
                            if m:
                                versions.append(m.group(1))
                        elif line and not line.startswith(" ") and not line.startswith("#"):
                            in_sources = False
        if versions:
            for v in versions:
                print(f"==> Exporting {pkg}/{v} ({pkg_dir})")
                subprocess.run(["conan", "export", pkg_dir, "--version", v], check=True)
        else:
            print(f"==> Exporting {pkg} ({pkg_dir})")
            subprocess.run(["conan", "export", pkg_dir], check=True)
'
'''

[tasks."setup:release"]
description = "Install Conan dependencies for Release configuration"
depends = ["setup:export-recipes"]
run = '''
case "$(uname -s 2>/dev/null || echo Windows)" in
    Linux*|Darwin*) PROFILE="conan/profiles/unix" ;;
    CYGWIN*|MINGW*|MSYS*) PROFILE="conan/profiles/windows" ;;
    *) PROFILE="conan/profiles/windows" ;;
esac
conan install . --build=missing -s build_type=Release -pr:h "$PROFILE" -pr:b "$PROFILE"
'''

[tasks."setup:debug"]
description = "Install Conan dependencies for Debug configuration"
depends = ["setup:export-recipes"]
run = '''
case "$(uname -s 2>/dev/null || echo Windows)" in
    Linux*|Darwin*) PROFILE="conan/profiles/unix" ;;
    CYGWIN*|MINGW*|MSYS*) PROFILE="conan/profiles/windows" ;;
    *) PROFILE="conan/profiles/windows" ;;
esac
conan install . --build=missing -s build_type=Debug -pr:h "$PROFILE" -pr:b "$PROFILE"
'''

[tasks.setup]
description = "Default dependency setup (Release)"
depends = ["setup:release"]

[tasks."configure:release"]
description = "Configure CMake for Release build"
depends = ["setup:release"]
run = '''
if [ -n "$MSYSTEM" ] || [ "$(uname -s 2>/dev/null)" = "Linux" ] || [ "$(uname -s 2>/dev/null)" = "Darwin" ]; then
    cmake --preset conan-release
else
    cmake --preset conan-default
fi
'''

[tasks."configure:debug"]
description = "Configure CMake for Debug build"
depends = ["setup:debug"]
run = '''
if [ -n "$MSYSTEM" ] || [ "$(uname -s 2>/dev/null)" = "Linux" ] || [ "$(uname -s 2>/dev/null)" = "Darwin" ]; then
    cmake --preset conan-debug
else
    cmake --preset conan-default
fi
'''

[tasks.configure]
description = "Default CMake configuration (Release)"
depends = ["configure:release"]

[tasks."build:release"]
description = "Build Release binaries"
depends = ["configure:release"]
run = '''
if [ -n "$MSYSTEM" ] || [ "$(uname -s 2>/dev/null)" = "Linux" ] || [ "$(uname -s 2>/dev/null)" = "Darwin" ]; then
    cmake --build --preset conan-release --parallel
else
    cmake --build --preset conan-default --config Release --parallel
fi
'''

[tasks."build:debug"]
description = "Build Debug binaries"
depends = ["configure:debug"]
run = '''
if [ -n "$MSYSTEM" ] || [ "$(uname -s 2>/dev/null)" = "Linux" ] || [ "$(uname -s 2>/dev/null)" = "Darwin" ]; then
    cmake --build --preset conan-debug --parallel
else
    cmake --build --preset conan-default --config Debug --parallel
fi
'''

[tasks.build]
description = "Default build (Release)"
depends = ["build:release"]

[tasks."test:release"]
description = "Run tests for Release build"
depends = ["build:release"]
run = '''
if [ -n "$MSYSTEM" ] || [ "$(uname -s 2>/dev/null)" = "Linux" ] || [ "$(uname -s 2>/dev/null)" = "Darwin" ]; then
    ctest --preset conan-release --output-on-failure
else
    ctest --preset conan-default -C Release --output-on-failure
fi
'''

[tasks."test:debug"]
description = "Run tests for Debug build"
depends = ["build:debug"]
run = '''
if [ -n "$MSYSTEM" ] || [ "$(uname -s 2>/dev/null)" = "Linux" ] || [ "$(uname -s 2>/dev/null)" = "Darwin" ]; then
    ctest --preset conan-debug --output-on-failure
else
    ctest --preset conan-default -C Debug --output-on-failure
fi
'''

[tasks.test]
description = "Default test (Release)"
depends = ["test:release"]

[tasks.format]
description = "Format C/C++ source files in src/ using clang-format"
run = '''
find src/ -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.c" -o -name "*.cc" -o -name "*.cxx" \) -exec clang-format -i {} +
'''

[tasks.tidy]
description = "Run clang-tidy on modified or specified source files"
run = '''
COMPILE_DB=$(find build build-* -name compile_commands.json -print -quit 2>/dev/null)
if [ -z "$COMPILE_DB" ]; then
    echo "Error: compile_commands.json not found in build directories. Please build the project first."
    exit 1
fi
COMPILE_DIR=$(dirname "$COMPILE_DB")
if [ "$#" -gt 0 ]; then
    clang-tidy -p "$COMPILE_DIR" "$@"
else
    FILES=$(git diff --name-only HEAD 2>/dev/null | grep -E '\.(cpp|h|hpp|c|cc|cxx)$' | grep '^src/' || true)
    if [ -z "$FILES" ]; then
        FILES=$(find src/ -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \))
    fi
    if [ -n "$FILES" ]; then
        clang-tidy -p "$COMPILE_DIR" $FILES
    else
        echo "No C++ files found to tidy."
    fi
fi
'''

[tasks.clean]
description = "Clean build directories"
run = '''
rm -rf build build-*
'''
