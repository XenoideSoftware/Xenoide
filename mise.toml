run_windows = 'powershell -ExecutionPolicy Bypass -File mise/tidy.ps1 -Configuration Release -Project {{ usage.project }}'

[tasks.tidy]
description = "Run clang-tidy against both Debug and Release builds for full coverage"
usage = '''
flag "--project <project>" help="Subproject to operate on: engine, ide, pocs or all" default="all" {
  choices "engine" "ide" "pocs" "all"
}
flag "--fix" help="Apply clang-tidy fix-its to source files"
flag "--full" help="Check all files in compile_commands.json instead of only git-modified files"
flag "--format" help="Reformat fixed files with clang-format (requires --fix)"
flag "--file <file>" help="Run clang-tidy on a single file, regardless of git status"
'''
depends = [
  { task = "configure:tidy:debug", args = ["--project", "{{usage.project}}"] },
  { task = "configure:tidy:release", args = ["--project", "{{usage.project}}"] },
]
run = """
./mise/tidy.sh Debug "{{ usage.project }}"
./mise/tidy.sh Release "{{ usage.project }}"
"""
run_windows = """
powershell -ExecutionPolicy Bypass -File mise/tidy.ps1 -Configuration Debug -Project {{ usage.project }}
powershell -ExecutionPolicy Bypass -File mise/tidy.ps1 -Configuration Release -Project {{ usage.project }}
"""

