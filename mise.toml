[tasks."export-recipes"]
description = "Export all local custom Conan recipes to cache"
run = "./mise/export-recipes.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/export-recipes.ps1"

[tasks."install:release"]
description = "Install Conan dependencies for Release configuration"
usage = '''
flag "--project <project>" help="Subproject to operate on: engine, ide, pocs or all" default="all" {
  choices "engine" "ide" "pocs" "all"
}
'''
run = './mise/install.sh Release "{{ usage.project }}"'
run_windows = 'powershell -ExecutionPolicy Bypass -File mise/install.ps1 -Configuration Release -Project {{ usage.project }}'

[tasks."install:debug"]
description = "Install Conan dependencies for Debug configuration"
usage = '''
flag "--project <project>" help="Subproject to operate on: engine, ide, pocs or all" default="all" {
  choices "engine" "ide" "pocs" "all"
}
'''
run = './mise/install.sh Debug "{{ usage.project }}"'
run_windows = 'powershell -ExecutionPolicy Bypass -File mise/install.ps1 -Configuration Debug -Project {{ usage.project }}'

