[tasks."setup:export-recipes"]
description = "Export all local custom Conan recipes to cache"
run = "./mise/setup-export-recipes.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/setup-export-recipes.ps1"

[tasks."setup:release"]
description = "Install Conan dependencies for Release configuration"
depends = ["setup:export-recipes"]
run = "./mise/setup-release.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/setup-release.ps1"

[tasks."setup:debug"]
description = "Install Conan dependencies for Debug configuration"
depends = ["setup:export-recipes"]
run = "./mise/setup-debug.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/setup-debug.ps1"

[tasks.setup]
description = "Default dependency setup (Release)"
depends = ["setup:release"]

[tasks."configure:release"]
description = "Configure CMake for Release build"
depends = ["setup:release"]
run = "./mise/configure-release.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/configure-release.ps1"

[tasks."configure:debug"]
description = "Configure CMake for Debug build"
depends = ["setup:debug"]
run = "./mise/configure-debug.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/configure-debug.ps1"

[tasks.configure]
description = "Default CMake configuration (Release)"
depends = ["configure:release"]

[tasks."build:release"]
description = "Build Release binaries"
depends = ["configure:release"]
run = "./mise/build-release.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/build-release.ps1"

[tasks."build:debug"]
description = "Build Debug binaries"
depends = ["configure:debug"]
run = "./mise/build-debug.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/build-debug.ps1"

[tasks.build]
description = "Default build (Release)"
depends = ["build:release"]

[tasks."test:release"]
description = "Run tests for Release build"
depends = ["build:release"]
run = "./mise/test-release.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/test-release.ps1"

[tasks."test:debug"]
description = "Run tests for Debug build"
depends = ["build:debug"]
run = "./mise/test-debug.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/test-debug.ps1"

[tasks.test]
description = "Default test (Release)"
depends = ["test:release"]

[tasks.format]
description = "Format C/C++ source files in src/ using clang-format"
run = "./mise/format.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/format.ps1"

[tasks.tidy]
description = "Run clang-tidy on modified or specified source files"
run = "./mise/tidy.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/tidy.ps1"

[tasks.clean]
description = "Clean build directories"
run = "./mise/clean.sh"
run_windows = "powershell -ExecutionPolicy Bypass -File mise/clean.ps1"
