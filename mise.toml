[tasks."tidy:debug"]
description = "Run clang-tidy against the Debug build"
usage = '''
flag "--project <project>" help="Subproject to operate on: engine, ide, pocs or all" default="all" {
  choices "engine" "ide" "pocs" "all"
}
flag "--fix" help="Apply clang-tidy fix-its to source files"
flag "--full" help="Check all files in compile_commands.json instead of only git-modified files"
flag "--format" help="Reformat fixed files with clang-format (requires --fix)"
flag "--file <file>" help="Run clang-tidy on a single file, regardless of git status"
'''
depends = [{ task = "configure:tidy:debug", args = ["--project", "{{usage.project}}"] }]
run = './mise/tidy.sh Debug "{{ usage.project }}"'
run_windows = 'powershell -ExecutionPolicy Bypass -File mise/tidy.ps1 -Configuration Debug -Project {{ usage.project }}'

